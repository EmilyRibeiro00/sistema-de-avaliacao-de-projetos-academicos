spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration-h2

app:
  jwt:
    secret: segredo-de-teste-com-pelo-menos-256-bits-para-o-hmac-sha
    access-token-expiracao-minutos: 60
  cors:
    origens-permitidas: http://localhost:5173
